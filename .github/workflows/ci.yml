name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual run: also publishes a release even if no extension file changed.
  workflow_dispatch:

jobs:
  check-and-pack:
    runs-on: ubuntu-latest
    permissions:
      # The catalog step commits signed pattern updates back to main.
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      # HEAD after the catalog step (a new commit when patterns changed), so the
      # release is cut from the tree that was actually checked and packed.
      sha: ${{ steps.catalog.outputs.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Pull requests: the merge ref as usual. Pushes: the branch itself, so
          # the catalog step can push a commit back.
          ref: ${{ github.event_name == 'push' && github.ref || '' }}
          # A deploy key with write access (secret CATALOG_DEPLOY_KEY) lets the
          # catalog step push to main: the ruleset's bypass list has a "Deploy
          # keys" entry, whereas the built-in GitHub Actions app cannot be added
          # from the UI. Empty when the secret is absent → the default token.
          ssh-key: ${{ secrets.CATALOG_DEPLOY_KEY }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Pattern catalog: when a push changes the built-in patterns, regenerate
      # catalog/patterns.json (bumping CATALOG_VERSION if the author did not),
      # sign it with the key in GELD_CATALOG_PRIVATE_KEY, verify, and commit it
      # back to main. Installed extensions fetch this file, so nothing else is
      # needed for a pattern change to reach users. Also re-signs after a key
      # rotation (new public key, stale .sig). A push made with GITHUB_TOKEN
      # does not start another CI run; the release below is cut from the new SHA.
      - name: Sign and publish the pattern catalog
        id: catalog
        if: github.event_name == 'push'
        env:
          GELD_CATALOG_PRIVATE_KEY: ${{ secrets.GELD_CATALOG_PRIVATE_KEY }}
        run: |
          pnpm catalog:build --auto-version
          if pnpm catalog:check; then echo "Catalog is current."; exit 0; fi
          if [ -z "$GELD_CATALOG_PRIVATE_KEY" ]; then
            echo "::error title=Catalog::The pattern catalog changed but the GELD_CATALOG_PRIVATE_KEY secret is not set, so it cannot be signed. Add the secret (see apps/extension/store/PUBLISHING.md) or sign locally with pnpm catalog:sign."
            exit 1
          fi
          pnpm catalog:sign
          pnpm catalog:check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/patterns.json catalog/patterns.sig packages/core/src/categories.ts
          version=$(node -p "require('./catalog/patterns.json').version")
          # [skip ci]: a deploy-key push would otherwise start a second CI run (and
          # release) for the commit this run is already about to release.
          git commit -m "catalog: publish patterns ${version} [skip ci]" -m "Generated and signed by CI from packages/core."
          if ! git push origin HEAD:main; then
            echo "::error title=Catalog::Could not push the signed catalog to main. Set up the CATALOG_DEPLOY_KEY secret (a deploy key with write access) and tick 'Deploy keys' in the main ruleset's bypass list — see apps/extension/store/PUBLISHING.md."
            exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "::notice title=Catalog::Published patterns ${version}."
      # Typechecks and unit tests for every workspace package (core + extension),
      # plus lint and a production build of the site.
      - run: pnpm check
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      # The pattern catalog the extension fetches at runtime is generated from
      # core and signed offline. Fail if catalog/patterns.json drifted from the
      # TypeScript or catalog/patterns.sig no longer matches it — an installed
      # extension would silently ignore the file otherwise.
      - run: pnpm catalog:check
      # Public client id of the GitHub OAuth App (device flow) used for sign-in.
      # Kept out of the source tree; set it as a repository Actions variable.
      # The run number becomes the fourth part of the manifest version
      # (0.1.1 → 0.1.1.68), so every build is publishable to the stores
      # without a version-bump commit. Pull request builds stay at the base.
      - run: pnpm zip:all
        env:
          WXT_GITHUB_CLIENT_ID: ${{ vars.WXT_GITHUB_CLIENT_ID }}
          GELD_BUILD_NUMBER: ${{ github.event_name == 'pull_request' && '' || github.run_number }}
      - id: version
        run: echo "version=$(node -p "require('./apps/extension/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: geld-extension-zips
          path: apps/extension/.output/*.zip
          # `.output` is a dot-directory, which upload-artifact skips by default.
          include-hidden-files: true
          if-no-files-found: error

  # Every push to main that touches the extension publishes a GitHub Release
  # with one zip per browser (plus the Firefox review sources). The site's
  # install buttons read /releases/latest, so this is what people download
  # until the store listings exist. Notes are auto-generated from the commits
  # since the previous release and can be edited afterwards on GitHub.
  release:
    needs: check-and-pack
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Decide whether the extension changed
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] || [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "release=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -Eq '^(apps/extension/|packages/core/|assets/brand/|pnpm-lock\.yaml$|\.github/workflows/ci\.yml$)'; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only the site changed; no release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v7
        if: steps.changed.outputs.release == 'true'
        with:
          name: geld-extension-zips
          path: dist
      - name: Publish release
        if: steps.changed.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check-and-pack.outputs.version }}
          RUN: ${{ github.run_number }}
          TARGET_SHA: ${{ needs.check-and-pack.outputs.sha }}
        run: |
          # The manifest version stays a plain x.y.z (stores require it); each
          # build on main gets its own tag so the release is never overwritten.
          tag="v${VERSION}-build.${RUN}"
          title="Geld ${VERSION}.${RUN}"
          ls -1 dist
          gh release create "$tag" dist/*.zip \
            --target "$TARGET_SHA" \
            --title "$title" \
            --generate-notes \
            --latest
          echo "Published $title as $tag"
