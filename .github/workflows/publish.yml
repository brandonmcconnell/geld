name: Publish to stores

# Publishes an existing GitHub Release's zips to the browser stores. Manual by
# design: every store reviews each submission (Chrome/Edge/Apple block a new
# submission while one is under review), so publishing on every push would
# mostly fail. Run it when a batch of changes is ready. Stores that report a
# pending review are skipped, not failed.
#
# Secrets (Settings → Secrets and variables → Actions):
#   Chrome  : CWS_EXTENSION_ID, CWS_CLIENT_ID, CWS_CLIENT_SECRET, CWS_REFRESH_TOKEN
#   Edge    : EDGE_PRODUCT_ID, EDGE_CLIENT_ID, EDGE_API_KEY
#   Firefox : AMO_JWT_ISSUER, AMO_JWT_SECRET  (add-on id comes from the manifest's browser_specific_settings)
#   Safari  : APPLE_ASC_KEY_ID, APPLE_ASC_ISSUER_ID, APPLE_ASC_PRIVATE_KEY (base64 .p8),
#             APPLE_CERTIFICATE_P12 (base64), APPLE_CERTIFICATE_PASSWORD, APPLE_TEAM_ID
# See apps/extension/store/PUBLISHING.md for where each comes from.

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Release tag to publish (empty = latest release)'
        required: false
        default: ''
      channels:
        description: 'Comma-separated stores: chrome, edge, firefox, safari'
        required: false
        default: 'chrome,edge,firefox,safari'
      notes:
        description: 'Reviewer notes (Edge / Firefox)'
        required: false
        default: 'Automated release. Source: https://github.com/brandonmcconnell/geld'

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  assets:
    name: Fetch release zips
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      version: ${{ steps.pick.outputs.version }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.release }}
        run: |
          tag="$REQUESTED"
          if [ -z "$tag" ]; then tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName); fi
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir dist --pattern '*.zip'
          ls -1 dist
          version=$(ls dist/*-chrome.zip | sed -E 's/.*geld-([0-9.]+)-chrome\.zip/\1/')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing $tag (manifest version $version)"
      - uses: actions/upload-artifact@v7
        with:
          name: store-zips
          path: dist/*.zip
          if-no-files-found: error

  chrome:
    name: Chrome Web Store
    needs: assets
    if: contains(inputs.channels, 'chrome')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: store-zips
          path: dist
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: publish
        env:
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          set +e
          node apps/extension/scripts/publish/chrome.mjs dist/*-chrome.zip
          code=$?
          if [ "$code" = "78" ]; then echo "::warning title=Chrome::Skipped: the item is pending review."; exit 0; fi
          exit $code

  edge:
    name: Microsoft Edge Add-ons
    needs: assets
    if: contains(inputs.channels, 'edge')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: store-zips
          path: dist
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: publish
        env:
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          PUBLISH_NOTES: ${{ inputs.notes }}
        run: |
          set +e
          node apps/extension/scripts/publish/edge.mjs dist/*-edge.zip
          code=$?
          if [ "$code" = "78" ]; then echo "::warning title=Edge::Skipped: a submission is already under review."; exit 0; fi
          exit $code

  firefox:
    name: Firefox Add-ons (AMO)
    needs: assets
    if: contains(inputs.channels, 'firefox')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: store-zips
          path: dist
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # web-ext needs a directory, and AMO wants the source archive for review
      # because the shipped code is bundled. Listed uploads are usually
      # auto-approved within minutes; a pending version never blocks a new one.
      - env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          NOTES: ${{ inputs.notes }}
        run: |
          mkdir -p unpacked && unzip -q dist/*-firefox.zip -d unpacked
          npx --yes web-ext@8 sign --source-dir unpacked --channel listed \
            --upload-source-code dist/*-sources.zip \
            --approval-timeout 0 \
            --amo-metadata <(printf '{"version":{"release_notes":{"en-US":%s},"approval_notes":%s}}' "$(jq -Rn --arg n "$NOTES" '$n')" "$(jq -Rn --arg n "$NOTES" '$n')")
          echo "::notice title=Firefox::Version uploaded; AMO signs and lists it after its automated review."

  safari:
    name: Safari (App Store Connect)
    needs: assets
    if: contains(inputs.channels, 'safari')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check credentials
        id: creds
        env:
          KEY: ${{ secrets.APPLE_ASC_KEY_ID }}
          CERT: ${{ secrets.APPLE_CERTIFICATE_P12 }}
        run: |
          if [ -z "$KEY" ] || [ -z "$CERT" ]; then
            echo "::warning title=Safari::Skipped: Apple credentials are not configured (see apps/extension/store/PUBLISHING.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v6
        if: steps.creds.outputs.ready == 'true'
      - uses: actions/setup-node@v7
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: 22
          cache: pnpm
      - if: steps.creds.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      # Rebuild the Safari flavour at the release's version and refresh the Xcode
      # wrapper (safari:sync copies the build in and stamps MARKETING_VERSION and
      # the build number). The release tag is vX.Y.Z-build.N → build number N.
      - if: steps.creds.outputs.ready == 'true'
        env:
          WXT_GITHUB_CLIENT_ID: ${{ vars.WXT_GITHUB_CLIENT_ID }}
          TAG: ${{ needs.assets.outputs.tag }}
        run: |
          export GELD_BUILD_NUMBER="${TAG##*build.}"
          pnpm --filter @geld/extension safari:sync
      - name: Import signing certificate
        if: steps.creds.outputs.ready == 'true'
        env:
          P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
      - name: Archive and export the App Store package
        if: steps.creds.outputs.ready == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APPLE_ASC_PRIVATE_KEY }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        working-directory: apps/extension/safari/Geld
        run: |
          mkdir -p ~/.private_keys && echo "$ASC_PRIVATE_KEY" | base64 --decode > ~/.private_keys/AuthKey_$ASC_KEY_ID.p8
          # Cloud signing: Xcode fetches/creates provisioning profiles (and the Mac
          # Installer Distribution certificate for the .pkg) with the API key.
          xcodebuild -project Geld.xcodeproj -scheme "Geld (macOS)" -configuration Release \
            -archivePath build/Geld.xcarchive archive \
            -allowProvisioningUpdates -authenticationKeyPath ~/.private_keys/AuthKey_$ASC_KEY_ID.p8 \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath build/Geld.xcarchive -exportOptionsPlist ExportOptions.plist -exportPath build/export \
            -allowProvisioningUpdates -authenticationKeyPath ~/.private_keys/AuthKey_$ASC_KEY_ID.p8 \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          ls -1 build/export
      # fastlane (preinstalled on GitHub's macOS runners) uploads the .pkg, waits for
      # App Store Connect to process it, attaches it to the version, fills in the
      # release notes and submits for review. --reject_if_possible withdraws a
      # submission still waiting for review so this one takes its place (a
      # submission already *in* review cannot be replaced; that case is reported
      # as skipped).
      - name: Upload and submit for review
        if: steps.creds.outputs.ready == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
          TAG: ${{ needs.assets.outputs.tag }}
          NOTES: ${{ inputs.notes }}
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          FASTLANE_HIDE_CHANGELOG: '1'
        working-directory: apps/extension/safari/Geld
        run: |
          version="${TAG#v}"; version="${version%%-build.*}"
          build="${TAG##*build.}"
          jq -n --arg k "$ASC_KEY_ID" --arg i "$ASC_ISSUER_ID" --rawfile p ~/.private_keys/AuthKey_$ASC_KEY_ID.p8 \
            '{key_id:$k, issuer_id:$i, key:$p, in_house:false}' > asc-key.json
          set +e
          fastlane deliver \
            --api_key_path asc-key.json \
            --app_identifier sh.geld.safari --platform osx \
            --pkg "$(ls build/export/*.pkg | head -n 1)" \
            --app_version "$version" --build_number "$build" \
            --skip_screenshots --skip_metadata false \
            --release_notes "$(jq -n --arg n "$NOTES" '{"en-US":$n}')" \
            --submission_information '{"export_compliance_uses_encryption":false,"export_compliance_encryption_updated":false,"add_id_info_uses_idfa":false}' \
            --run_precheck_before_submit false \
            --submit_for_review --automatic_release --reject_if_possible \
            --force 2>&1 | tee deliver.log
          code=${PIPESTATUS[0]}
          if [ "$code" != "0" ] && grep -qiE "in review|cannot be rejected|already been submitted|IN_REVIEW" deliver.log; then
            echo "::warning title=Safari::Uploaded, but a submission is already in review and cannot be replaced; submit it in App Store Connect once that review ends."
            exit 0
          fi
          [ "$code" = "0" ] && echo "::notice title=Safari::Build $version ($build) uploaded and submitted for review."
          exit $code
