name: Publish to stores

# Publishes a GitHub Release's zips to the browser stores.
#
# When it runs:
#   - Twice a day (05:17 and 17:17 UTC) with the latest release. This is the
#     normal path: a change on main reaches every store within about twelve
#     hours. Two a day leaves room under the stores' quotas for urgent pushes.
#   - After a CI run on main whose commit message contains "[publish]": an
#     urgent release that should not wait for the schedule.
#   - On demand from the Actions tab (workflow_dispatch), optionally for one
#     release tag and a subset of stores.
#
# Every store reviews each submission, and Chrome/Edge/Apple refuse a new one
# while the previous is under review (Apple lets us withdraw it; the others do
# not), so a store that is busy is *skipped* with a warning and the next
# scheduled run publishes the newest release once it clears. Firefox has no
# blocking review but an API quota (24 submissions and 48 file uploads a day per
# account), so a version AMO already has is detected with a read-only request
# *before* anything is uploaded, and a throttled answer is a skip that the next
# run retries. Nothing here fails silently: every skip is a warning annotation
# on the run, and a skipped version is retried by the schedule.
#
# Secrets (Settings → Secrets and variables → Actions):
#   Chrome  : CWS_EXTENSION_ID, CWS_CLIENT_ID, CWS_CLIENT_SECRET, CWS_REFRESH_TOKEN
#   Edge    : EDGE_PRODUCT_ID, EDGE_CLIENT_ID, EDGE_API_KEY
#   Firefox : AMO_JWT_ISSUER, AMO_JWT_SECRET  (add-on id comes from the manifest's browser_specific_settings)
#   Safari  : APPLE_ASC_KEY_ID, APPLE_ASC_ISSUER_ID, APPLE_ASC_PRIVATE_KEY (base64 .p8),
#             APPLE_CERTIFICATE_P12 (base64), APPLE_CERTIFICATE_PASSWORD, APPLE_TEAM_ID
# See apps/extension/store/PUBLISHING.md for where each comes from.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '17 5,17 * * *'
  workflow_dispatch:
    inputs:
      release:
        description: 'Release tag to publish (empty = latest release)'
        required: false
        default: ''
      channels:
        description: 'Comma-separated stores: chrome, edge, firefox, safari'
        required: false
        default: 'chrome,edge,firefox,safari'
      notes:
        description: 'Reviewer notes (Edge / Firefox)'
        required: false
        default: 'Automated release. Source: https://github.com/brandonmcconnell/geld'

concurrency:
  group: publish
  cancel-in-progress: false

env:
  DEFAULT_NOTES: 'Automated release. Source: https://github.com/brandonmcconnell/geld'

jobs:
  assets:
    name: Fetch release zips
    # After CI: only when it succeeded (it publishes the release in the same run)
    # and the commit asked for an urgent publish with "[publish]"; everything
    # else waits for the twice-daily schedule.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && contains(github.event.workflow_run.head_commit.message, '[publish]'))
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      version: ${{ steps.pick.outputs.version }}
      channels: ${{ steps.pick.outputs.channels }}
      notes: ${{ steps.pick.outputs.notes }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.release }}
          CHANNELS: ${{ inputs.channels || 'chrome,edge,firefox,safari' }}
          NOTES: ${{ inputs.notes || env.DEFAULT_NOTES }}
        run: |
          echo "channels=$CHANNELS" >> "$GITHUB_OUTPUT"
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"
          tag="$REQUESTED"
          if [ -z "$tag" ]; then tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName); fi
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir dist --pattern '*.zip'
          ls -1 dist
          version=$(ls dist/*-chrome.zip | sed -E 's/.*geld-([0-9.]+)-chrome\.zip/\1/')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing $tag (manifest version $version)"
      - uses: actions/upload-artifact@v7
        with:
          name: store-zips
          path: dist/*.zip
          if-no-files-found: error

  chrome:
    name: Chrome Web Store
    needs: assets
    if: contains(needs.assets.outputs.channels, 'chrome')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: store-zips
          path: dist
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: publish
        env:
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          set +e
          node apps/extension/scripts/publish/chrome.mjs dist/*-chrome.zip
          code=$?
          if [ "$code" = "78" ]; then echo "::notice title=Chrome::Skipped (pending review or already at this version); see log."; exit 0; fi
          exit $code

  edge:
    name: Microsoft Edge Add-ons
    needs: assets
    if: contains(needs.assets.outputs.channels, 'edge')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: store-zips
          path: dist
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: publish
        env:
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          PUBLISH_NOTES: ${{ needs.assets.outputs.notes }}
        run: |
          set +e
          node apps/extension/scripts/publish/edge.mjs dist/*-edge.zip
          code=$?
          if [ "$code" = "78" ]; then echo "::notice title=Edge::Skipped (submission under review or already at this version); see log."; exit 0; fi
          exit $code

  firefox:
    name: Firefox Add-ons (AMO)
    needs: assets
    if: contains(needs.assets.outputs.channels, 'firefox')
    runs-on: ubuntu-latest
    steps:
      # Checkout first: it cleans the workspace, which would delete the downloaded zips.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: apps/extension/scripts/publish
      - uses: actions/download-artifact@v7
        with:
          name: store-zips
          path: dist
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # web-ext needs a directory, and AMO wants the source archive for review
      # because the shipped code is bundled. Listed uploads are usually
      # auto-approved within minutes; a pending version never blocks a new one.
      # A version AMO already has is detected with a read-only request first:
      # web-ext would otherwise upload both files before finding out, and AMO
      # allows 48 uploads a day per account.
      - env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          NOTES: ${{ needs.assets.outputs.notes }}
        run: |
          mkdir -p unpacked && unzip -q dist/*-firefox.zip -d unpacked
          known=$(node apps/extension/scripts/publish/amo-version-exists.mjs unpacked || echo "unknown")
          echo "AMO already has this version: $known"
          if [ "$known" = "exists" ]; then
            echo "::notice title=Firefox::Skipped: AMO already has this version (checked without uploading)."; exit 0
          fi
          set +e
          npx --yes web-ext@8 sign --source-dir unpacked --channel listed \
            --upload-source-code dist/*-sources.zip \
            --approval-timeout 0 \
            --amo-metadata <(printf '{"version":{"release_notes":{"en-US":%s},"approval_notes":%s}}' "$(jq -Rn --arg n "$NOTES" '$n')" "$(jq -Rn --arg n "$NOTES" '$n')") 2>&1 | tee sign.log
          code=${PIPESTATUS[0]}
          set -e
          # Re-runs (scheduled) hit "Version already exists": nothing to do.
          if [ "$code" != "0" ] && grep -qiE "version (already exists|.*already been uploaded|.*duplicate)" sign.log; then
            echo "::notice title=Firefox::Skipped: AMO already has this version."; exit 0
          fi
          # 409: AMO is still processing/reviewing the previous upload for this add-on; the next run retries.
          if [ "$code" != "0" ] && grep -qiE "Conflict|409" sign.log; then
            echo "::warning title=Firefox::Skipped: AMO reported a conflict (a previous version is still being processed); will retry on the next run."; exit 0
          fi
          # AMO has a per-add-on daily submission quota (several releases in one day
          # hit it). web-ext reports it as a 429 on the source upload or, on the
          # version submission, as "Unknown Error" with a body reading "Request was
          # throttled. Expected available in N seconds." Either way: next run retries.
          if [ "$code" != "0" ] && grep -qiE "status was 429|Too Many Requests|429|throttled" sign.log; then
            wait=$(grep -oiE "available in [0-9]+ seconds" sign.log | grep -oE "[0-9]+" | head -n 1)
            echo "::warning title=Firefox::Skipped: AMO's daily submission quota for this add-on is used up${wait:+ (available again in about $((wait / 3600)) h)}; the next scheduled run retries."; exit 0
          fi
          [ "$code" = "0" ] || exit "$code"
          echo "::notice title=Firefox::Version uploaded; AMO signs and lists it after its automated review."

  safari:
    name: Safari (App Store Connect)
    needs: assets
    if: contains(needs.assets.outputs.channels, 'safari')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check credentials
        id: creds
        env:
          KEY: ${{ secrets.APPLE_ASC_KEY_ID }}
          CERT: ${{ secrets.APPLE_CERTIFICATE_P12 }}
        run: |
          if [ -z "$KEY" ] || [ -z "$CERT" ]; then
            echo "::warning title=Safari::Skipped: Apple credentials are not configured (see apps/extension/store/PUBLISHING.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      # A build App Store Connect already has is detected with a read-only API
      # call before spending minutes archiving and uploading a package Apple
      # would refuse as redundant. The release tag is vX.Y.Z-build.N.
      - name: Check App Store Connect for this build
        id: known
        if: steps.creds.outputs.ready == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APPLE_ASC_PRIVATE_KEY }}
          TAG: ${{ needs.assets.outputs.tag }}
        run: |
          marketing="${TAG#v}"; marketing="${marketing%%-build.*}"; build="${TAG##*build.}"
          known=$(node apps/extension/scripts/publish/asc-build-exists.mjs sh.geld.safari "$marketing" "$build" || echo "unknown")
          echo "App Store Connect already has build $marketing ($build): $known"
          echo "state=$known" >> "$GITHUB_OUTPUT"
          if [ "$known" = "exists" ]; then
            echo "::notice title=Safari::Skipped: App Store Connect already has build $marketing ($build) (checked without archiving)."
          fi
      - uses: pnpm/action-setup@v6
        if: steps.creds.outputs.ready == 'true' && steps.known.outputs.state != 'exists'
      - uses: actions/setup-node@v7
        if: steps.creds.outputs.ready == 'true' && steps.known.outputs.state != 'exists'
        with:
          node-version: 22
          cache: pnpm
      - if: steps.creds.outputs.ready == 'true' && steps.known.outputs.state != 'exists'
        run: pnpm install --frozen-lockfile
      # Rebuild the Safari flavour at the release's version and refresh the Xcode
      # wrapper (safari:sync copies the build in and stamps MARKETING_VERSION and
      # the build number). The release tag is vX.Y.Z-build.N → build number N.
      - if: steps.creds.outputs.ready == 'true' && steps.known.outputs.state != 'exists'
        env:
          WXT_GITHUB_CLIENT_ID: ${{ vars.WXT_GITHUB_CLIENT_ID }}
          TAG: ${{ needs.assets.outputs.tag }}
        run: |
          export GELD_BUILD_NUMBER="${TAG##*build.}"
          pnpm --filter @geld/extension safari:sync
      - name: Import signing certificate
        if: steps.creds.outputs.ready == 'true' && steps.known.outputs.state != 'exists'
        env:
          P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
      - name: Archive and export the App Store package
        if: steps.creds.outputs.ready == 'true' && steps.known.outputs.state != 'exists'
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APPLE_ASC_PRIVATE_KEY }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        working-directory: apps/extension/safari/Geld
        run: |
          mkdir -p ~/.private_keys && echo "$ASC_PRIVATE_KEY" | base64 --decode > ~/.private_keys/AuthKey_$ASC_KEY_ID.p8
          # Cloud signing: Xcode fetches/creates provisioning profiles (and the Mac
          # Installer Distribution certificate for the .pkg) with the API key.
          # The archive itself is signed ad hoc ("-"): a real signature carrying the
          # entitlements (app sandbox), needing no certificate or profile. The
          # export step below re-signs everything for the App Store with the
          # imported Apple Distribution certificate, as it always has. Left to
          # automatic signing, the archive would be signed with a *development*
          # identity and, finding none on this fresh runner, Xcode minted a new
          # "Mac Development" certificate every run until the account hit Apple's
          # certificate cap and every archive failed.
          xcodebuild -project Geld.xcodeproj -scheme "Geld (macOS)" -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath build/Geld.xcarchive archive \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="-" PROVISIONING_PROFILE_SPECIFIER=""
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath build/Geld.xcarchive -exportOptionsPlist ExportOptions.plist -exportPath build/export \
            -allowProvisioningUpdates -authenticationKeyPath ~/.private_keys/AuthKey_$ASC_KEY_ID.p8 \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          ls -1 build/export
      # fastlane (preinstalled on GitHub's macOS runners) uploads the .pkg, waits for
      # App Store Connect to process it, attaches it to the version, fills in the
      # release notes and submits for review. --reject_if_possible withdraws a
      # submission still waiting for review so this one takes its place (a
      # submission already *in* review cannot be replaced; that case is reported
      # as skipped).
      - name: Upload and submit for review
        if: steps.creds.outputs.ready == 'true' && steps.known.outputs.state != 'exists'
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
          TAG: ${{ needs.assets.outputs.tag }}
          NOTES: ${{ needs.assets.outputs.notes }}
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          FASTLANE_HIDE_CHANGELOG: '1'
        working-directory: apps/extension/safari/Geld
        run: |
          version="${TAG#v}"; version="${version%%-build.*}"
          build="${TAG##*build.}"
          jq -n --arg k "$ASC_KEY_ID" --arg i "$ASC_ISSUER_ID" --rawfile p ~/.private_keys/AuthKey_$ASC_KEY_ID.p8 \
            '{key_id:$k, issuer_id:$i, key:$p, in_house:false}' > asc-key.json
          set +e
          fastlane deliver \
            --api_key_path asc-key.json \
            --app_identifier sh.geld.safari --platform osx \
            --pkg "$(ls build/export/*.pkg | head -n 1)" \
            --app_version "$version" \
            --skip_screenshots --skip_metadata false \
            --release_notes "$(jq -n --arg n "$NOTES" '{"en-US":$n}')" \
            --submission_information '{"export_compliance_uses_encryption":false,"export_compliance_encryption_updated":false,"add_id_info_uses_idfa":false}' \
            --run_precheck_before_submit false \
            --submit_for_review --automatic_release --reject_if_possible \
            --force 2>&1 | tee deliver.log
          code=${PIPESTATUS[0]}
          # No app record in App Store Connect for the bundle id yet (fastlane's find_app returns nil).
          if [ "$code" != "0" ] && grep -qiE "find_app|team_id' for nil|Could not find app with bundle identifier" deliver.log; then
            echo "::error title=Safari::Build exported, but App Store Connect has no app for sh.geld.safari. Create it once by hand (My Apps → + → New App, macOS, bundle id sh.geld.safari) and fill in the listing (name, category, description, screenshots, privacy policy, age rating); see PUBLISHING.md. Later runs then upload and submit automatically."
            exit 1
          fi
          if [ "$code" != "0" ] && grep -qiE "in review|cannot be rejected|already been submitted|IN_REVIEW" deliver.log; then
            echo "::warning title=Safari::Uploaded, but a submission is already in review and cannot be replaced; submit it in App Store Connect once that review ends."
            exit 0
          fi
          # Scheduled re-runs: this build number is already on App Store Connect.
          if [ "$code" != "0" ] && grep -qiE "bundle version must be higher|already been used|has already been uploaded|redundant binary" deliver.log; then
            echo "::notice title=Safari::Skipped: App Store Connect already has build $build."
            exit 0
          fi
          [ "$code" = "0" ] && echo "::notice title=Safari::Build $version ($build) uploaded and submitted for review."
          exit $code
