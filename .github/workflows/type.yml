name: Type

# Builds Geld Sans and Geld Dark Sans from packages/type, checks the compiled fonts against the
# source, and keeps them as an artifact. TypeScript tests for the package run in CI's `pnpm check`.
# A `type-vX.Y.Z` tag (X.Y.Z the package's version) also publishes a GitHub Release with a zip per
# family and the @geld/fonts package, never marked latest: the site's install buttons read the
# latest release, which is the extension's.
on:
  push:
    branches: [main]
    tags: ['type-v*']
    paths: ['packages/type/**', 'assets/brand/**', '.github/workflows/type.yml']
  pull_request:
    paths: ['packages/type/**', 'assets/brand/**', '.github/workflows/type.yml']
  workflow_dispatch:

jobs:
  fonts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: packages/type/requirements.txt
      - run: pnpm install --frozen-lockfile --filter @geld/type...
      - run: pip install -r packages/type/requirements.txt
      - run: pnpm --filter @geld/type check
      - run: pnpm --filter @geld/type joins
      - run: pnpm --filter @geld/type build
      - uses: actions/upload-artifact@v7
        with:
          name: geld-sans-fonts
          path: |
            packages/type/dist/variable
            packages/type/dist/ttf
            packages/type/dist/otf
            packages/type/dist/web
            packages/type/dist/proof.html
            packages/type/dist/package.json
            packages/type/dist/README.md
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/type-v')
    needs: fonts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: geld-sans-fonts
          path: dist
      - name: Package and publish
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#type-v}"
          packaged="$(node -p "require('./package.json').version")"
          if [ "$version" != "$packaged" ]; then echo "Tag $GITHUB_REF_NAME does not match the package version $packaged"; exit 1; fi
          # One zip per family. Geld Sans's globs would also take Geld Sans Cut's files, so the cut ones are excluded.
          for family in GeldSans:geld-sans GeldDarkSans:geld-dark-sans GeldSansCut:geld-sans-cut GeldDarkSansCut:geld-dark-sans-cut; do
            name="${family%%:*}"; slug="${family#*:}"
            zip -r "../$name-$version.zip" README.md specimen.html "variable/$name[wght].ttf" "variable/$name-Italic[wght].ttf" ttf/"$name"-* otf/"$name"-* web/"$name"-* web/"$slug".css web/"$slug"-static.css web/"$slug"-* web/geld-features.css -x "web/$slug-cut*"
          done
          npm pack --pack-destination ..
          gh release create "$GITHUB_REF_NAME" ../*.zip ../*.tgz --title "Geld Sans $version" --latest=false --generate-notes
