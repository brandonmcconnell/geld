name: Installed browser tests

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - '.github/workflows/browser-e2e.yml'
      - 'apps/extension/**'
      - 'packages/core/**'
      - 'packages/review/**'
      - 'packages/github/**'
      - 'pnpm-lock.yaml'
  workflow_dispatch:
    inputs:
      focus:
        description: 'Public read-only slice; unselected cases are reported without a pass. Respect carried provider cooldowns.'
        required: true
        default: regression
        type: choice
        options:
          - regression
          - bitbucket-diff
          - bitbucket-list
          - bitbucket-comment
          - bitbucket-commit
          - gitlab-lists
          - gitlab-diff
          - gitlab-review
          - gitlab-bot
          - gitlab-references
          - gitlab-binary
          - github
          - all

concurrency:
  group: geld-installed-browser-public-providers
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  installed-extension:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GELD_BROWSER_ARTIFACTS: ${{ github.workspace }}/artifacts/browser-e2e
      GELD_BROWSER_PREVIOUS_REPORT: ${{ github.workspace }}/.browser-previous-evidence/report.json
      GELD_BROWSER_FOCUS: ${{ github.event_name == 'workflow_dispatch' && inputs.focus || 'regression' }}
    steps:
      - name: Select a public verification slice
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const request = context.payload.pull_request;
            const sameRepository = request?.head?.repo?.full_name === `${context.repo.owner}/${context.repo.repo}`;
            const marker = sameRepository ? /<!-- geld-browser-focus: ([a-z-]+) -->/.exec(request.body ?? '') : null;
            const choices = new Set(['regression', 'bitbucket-diff', 'bitbucket-list', 'bitbucket-comment', 'bitbucket-commit', 'gitlab-lists', 'gitlab-diff', 'gitlab-review', 'gitlab-bot', 'gitlab-references', 'gitlab-binary', 'github', 'all']);
            if (marker !== null && choices.has(marker[1])) {
              core.exportVariable('GELD_BROWSER_FOCUS', marker[1]);
              core.info(`Selected public verification slice: ${marker[1]}.`);
            }
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Find prior provider cooldown evidence
        id: cooldowns
        uses: actions/github-script@v9
        with:
          script: |
            const repository = context.repo;
            const current = await github.rest.actions.getWorkflowRun({ ...repository, run_id: context.runId });
            const runs = await github.rest.actions.listWorkflowRuns({ ...repository, workflow_id: current.data.workflow_id, status: 'completed', per_page: 30 });
            for (const run of runs.data.workflow_runs) {
              if (run.id === context.runId || run.head_repository?.full_name !== `${repository.owner}/${repository.repo}`) continue;
              const result = await github.rest.actions.listWorkflowRunArtifacts({ ...repository, run_id: run.id, per_page: 20 });
              if (!result.data.artifacts.some((artifact) => artifact.name === 'geld-installed-browser-e2e' && !artifact.expired)) continue;
              core.setOutput('run-id', String(run.id));
              core.info(`Loading provider cooldown evidence from installed run ${run.id}.`);
              break;
            }
      - name: Restore prior provider cooldown evidence
        if: steps.cooldowns.outputs.run-id != ''
        uses: actions/download-artifact@v7
        with:
          name: geld-installed-browser-e2e
          run-id: ${{ steps.cooldowns.outputs.run-id }}
          github-token: ${{ github.token }}
          path: .browser-previous-evidence
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @geld/extension build:chrome
      - name: Locate the runner's Chrome
        shell: bash
        run: |
          browser_executable="$(command -v google-chrome-stable || command -v google-chrome)"
          "$browser_executable" --version
          echo "GELD_BROWSER_EXECUTABLE=$browser_executable" >> "$GITHUB_ENV"
      - name: Test the installed extension on public pages
        run: pnpm --filter @geld/extension test:browser
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: geld-installed-browser-e2e
          path: artifacts/browser-e2e
          if-no-files-found: warn
          retention-days: 7
