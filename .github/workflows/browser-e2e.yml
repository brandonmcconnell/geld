name: Installed browser tests

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - '.github/workflows/browser-e2e.yml'
      - 'apps/extension/**'
      - 'packages/core/**'
      - 'packages/review/**'
      - 'packages/github/**'
      - 'pnpm-lock.yaml'
  workflow_dispatch:
    inputs:
      focus:
        description: 'Public verification slice; explicit syntax-on focus changes/restores only an ephemeral anonymous native preference. Respect carried cooldowns.'
        required: true
        default: regression
        type: choice
        options:
          - regression
          - bitbucket-diff
          - bitbucket-ui
          - gitlab-ui
          - bitbucket-whitespace-session
          - bitbucket-whitespace-source
          - bitbucket-pipeline-shell
          - bitbucket-pipeline-syntax-on
          - bitbucket-pipeline-initial-on
          - bitbucket-list
          - bitbucket-authors
          - bitbucket-native-bash
          - bitbucket-native-bash-on
          - bitbucket-native-settings-diagnostic
          - bitbucket-native-file-menu
          - bitbucket-local-reviewed
          - bitbucket-comment
          - bitbucket-commit
          - bitbucket-commit-links
          - bitbucket-list-commit
          - gitlab-lists
          - gitlab-diff
          - gitlab-file-search
          - gitlab-whitespace-viewed
          - gitlab-whitespace-session
          - bitbucket-pr-whole-context
          - bitbucket-whole-context
          - gitlab-shell
          - gitlab-standalone-whole
          - gitlab-review
          - gitlab-bot
          - gitlab-coderabbit
          - gitlab-references
          - gitlab-binary
          - github
          - cross-provider-settings
          - all

permissions:
  contents: read
  actions: read

# Maintainer-labelled restacks defer public traffic; skipped jobs are not feature passes.
jobs:
  select-public-verification:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.selection.outputs.run }}
      focus: ${{ steps.selection.outputs.focus }}
    steps:
      - name: Select a public verification slice
        id: selection
        uses: actions/github-script@v9
        with:
          script: |
            const choices = new Set(['regression', 'bitbucket-diff', 'bitbucket-ui', 'gitlab-ui', 'bitbucket-whitespace-session', 'bitbucket-whitespace-source', 'bitbucket-pipeline-shell', 'bitbucket-pipeline-syntax-on', 'bitbucket-pipeline-initial-on', 'bitbucket-list', 'bitbucket-authors', 'bitbucket-native-bash', 'bitbucket-native-bash-on', 'bitbucket-native-settings-diagnostic', 'bitbucket-native-file-menu', 'bitbucket-local-reviewed', 'bitbucket-comment', 'bitbucket-commit', 'bitbucket-commit-links', 'bitbucket-list-commit', 'gitlab-lists', 'gitlab-diff', 'gitlab-file-search', 'gitlab-whitespace-viewed', 'gitlab-whitespace-session', 'bitbucket-pr-whole-context', 'bitbucket-whole-context', 'gitlab-shell', 'gitlab-standalone-whole', 'gitlab-review', 'gitlab-bot', 'gitlab-coderabbit', 'gitlab-references', 'gitlab-binary', 'github', 'cross-provider-settings', 'all']);
            const parseFocus = (body) => {
              const text = typeof body === 'string' ? body : '';
              const prefixes = text.match(/<!-- geld-browser-focus:/g) ?? [];
              const markers = [...text.matchAll(/<!-- geld-browser-focus: ([a-z-]+) -->/g)];
              if (prefixes.length === 0) return { focus: 'regression', valid: true };
              if (prefixes.length !== 1 || markers.length !== 1 || !choices.has(markers[0][1])) return { focus: 'regression', valid: false };
              return { focus: markers[0][1], valid: true };
            };
            let focus = 'regression';
            let run = false;
            if (context.eventName === 'workflow_dispatch') {
              const input = context.payload.inputs?.focus ?? 'regression';
              if (choices.has(input)) { focus = input; run = true; }
              else core.setFailed('Unsupported public verification focus. No provider navigation allowed.');
            } else if (context.eventName === 'pull_request') {
              const request = context.payload.pull_request;
              const sameRepository = request?.head?.repo?.full_name === `${context.repo.owner}/${context.repo.repo}`;
              const selected = sameRepository ? parseFocus(request.body) : { focus: 'regression', valid: true };
              focus = selected.focus;
              if (['opened', 'synchronize', 'reopened'].includes(context.payload.action)) run = true;
              else if (context.payload.action === 'edited' && sameRepository && selected.valid) {
                const change = context.payload.changes?.body;
                if (change && Object.hasOwn(change, 'from') && (typeof change.from === 'string' || change.from === null)) run = parseFocus(change.from).focus !== focus;
              }
            }
            const restack = context.eventName === 'pull_request' && (context.payload.pull_request?.labels ?? []).some(label => label?.name === 'geld:restack');
            if (restack) run = false;
            core.setOutput('focus', focus);
            core.setOutput('run', run ? 'true' : 'false');
            core.info(restack ? 'Public provider verification deferred for this maintainer-labelled restack. Normal CI remains required. No public feature verification ran or passed.' : run ? `Selected public verification slice: ${focus}.` : 'Skipping provider navigation: this event did not request a valid focus change. No feature verification ran or passed.');
  installed-extension:
    needs: select-public-verification
    if: needs.select-public-verification.outputs.run == 'true' && needs.select-public-verification.outputs.focus != 'bitbucket-whitespace-source' && (github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'geld:restack'))
    # Skipped selector updates never enter the browser queue.
    # GitHub keeps one running and one pending job; a new selected job may replace the pending job without FIFO guarantees.
    concurrency:
      group: geld-installed-browser-public-providers
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GELD_BROWSER_ARTIFACTS: ${{ github.workspace }}/artifacts/browser-e2e
      GELD_BROWSER_PREVIOUS_REPORT: ${{ github.workspace }}/.browser-previous-evidence/report.json
      GELD_BROWSER_FOCUS: ${{ needs.select-public-verification.outputs.focus }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Find prior provider cooldown evidence
        id: cooldowns
        uses: actions/github-script@v9
        with:
          script: |
            const repository = context.repo;
            const artifactName = 'geld-installed-browser-e2e';
            const current = (await github.rest.actions.getWorkflowRun({ ...repository, run_id: context.runId })).data;
            const expectedRepository = `${repository.owner}/${repository.repo}`;
            if (current.id !== context.runId || !Number.isSafeInteger(current.workflow_id) || current.head_repository?.full_name !== expectedRepository) throw Error('Current cooldown history repository is unqualified');
            // https://docs.github.com/en/rest/actions/artifacts#list-artifacts-for-a-repository
            // The exact name filter skips unrelated artifacts and skip-only workflow runs.
            const artifacts = [];
            let exhausted = false;
            let total = null;
            for (let page = 1; page <= 5; page++) {
              const result = await github.rest.actions.listArtifactsForRepo({ ...repository, name: artifactName, per_page: 100, page });
              if (!Array.isArray(result.data.artifacts) || !Number.isSafeInteger(result.data.total_count) || result.data.total_count < 0) throw Error('Malformed cooldown artifact history');
              if (total !== null && total !== result.data.total_count) throw Error('Cooldown artifact history changed during discovery');
              total = result.data.total_count;
              if (result.data.artifacts.length > 100) throw Error('Oversized cooldown artifact page');
              artifacts.push(...result.data.artifacts);
              if (artifacts.length > total || (result.data.artifacts.length < 100 && artifacts.length < total)) throw Error('Incomplete cooldown artifact page');
              if (artifacts.length === total) { exhausted = true;break; }
            }
            if (!exhausted) throw Error('Cooldown artifact history exceeded its bounded scan; no provider navigation allowed');
            const ids = new Set();
            const candidates = [];
            for (const artifact of artifacts) {
              if (artifact.name !== artifactName) throw Error('Cooldown artifact name filter was not respected');
              if (!Number.isSafeInteger(artifact.id) || ids.has(artifact.id)) throw Error('Ambiguous cooldown artifact pagination');
              ids.add(artifact.id);
              const created = Date.parse(artifact.created_at);
              if (!Number.isFinite(created) || !Number.isSafeInteger(artifact.workflow_run?.id)) throw Error('Malformed cooldown artifact provenance');
              if (artifact.expired) {
                if (created > Date.now() - 60 * 60 * 1000) throw Error('Recent cooldown evidence is unavailable; no provider navigation allowed');
                continue;
              }
              if (artifact.workflow_run.id === context.runId) throw Error('Current run has prior-attempt evidence; resolve its cooldown before retrying');
              candidates.push({ artifact, created });
            }
            candidates.sort((left, right) => right.created - left.created || right.artifact.id - left.artifact.id);
            let selected = null;
            let inspected = 0;
            for (const candidate of candidates) {
              if (selected !== null && candidate.created < selected.created) break;
              if (++inspected > 100) throw Error('Cooldown provenance exceeded its bounded scan; no provider navigation allowed');
              const run = (await github.rest.actions.getWorkflowRun({ ...repository, run_id: candidate.artifact.workflow_run.id })).data;
              if (!Number.isSafeInteger(run.workflow_id) || run.id !== candidate.artifact.workflow_run.id) throw Error('Cooldown run identity mismatch');
              if (run.head_repository?.full_name !== expectedRepository || run.workflow_id !== current.workflow_id) continue;
              if (run.status !== 'completed') throw Error('Prior provider verification is still running; no provider navigation allowed');
              if (selected !== null) throw Error('Ambiguous latest cooldown evidence; no provider navigation allowed');
              selected = candidate;
            }
            if (selected === null) core.info('No retained matching provider cooldown history exists; initial verification is permitted.');
            else {
              core.setOutput('run-id', String(selected.artifact.workflow_run.id));
              core.info(`Loading provider cooldown evidence from installed run ${selected.artifact.workflow_run.id}.`);
            }
      - name: Restore prior provider cooldown evidence
        if: steps.cooldowns.outputs.run-id != ''
        uses: actions/download-artifact@v7
        with:
          name: geld-installed-browser-e2e
          run-id: ${{ steps.cooldowns.outputs.run-id }}
          github-token: ${{ github.token }}
          path: .browser-previous-evidence
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @geld/extension build:chrome
      - name: Locate the runner's Chrome
        shell: bash
        run: |
          browser_executable="$(command -v google-chrome-stable || command -v google-chrome)"
          "$browser_executable" --version
          echo "GELD_BROWSER_EXECUTABLE=$browser_executable" >> "$GITHUB_ENV"
      - name: Test the installed extension on public pages
        timeout-minutes: ${{ needs.select-public-verification.outputs.focus == 'bitbucket-whitespace-session' && 5 || 15 }}
        run: pnpm --filter @geld/extension test:browser
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: geld-installed-browser-e2e
          path: artifacts/browser-e2e
          if-no-files-found: warn
          retention-days: 7

  bitbucket-static-source:
    needs: select-public-verification
    if: needs.select-public-verification.outputs.run == 'true' && needs.select-public-verification.outputs.focus == 'bitbucket-whitespace-source' && (github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'geld:restack'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GELD_SOURCE_ARTIFACTS: ${{ github.workspace }}/artifacts/bitbucket-source-research
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Read fixed public PR loader dependencies as source
        run: node apps/extension/scripts/bitbucket-whitespace-source-research.mjs --pr-dependencies
      - name: Save bounded static source evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: geld-bitbucket-source-research
          path: artifacts/bitbucket-source-research
          if-no-files-found: warn
          retention-days: 7
