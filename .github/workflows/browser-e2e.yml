name: Installed browser tests

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - '.github/workflows/browser-e2e.yml'
      - 'apps/extension/**'
      - 'packages/core/**'
      - 'packages/review/**'
      - 'packages/github/**'
      - 'pnpm-lock.yaml'
  workflow_dispatch:
    inputs:
      focus:
        description: 'Public verification slice; explicit syntax-on focus changes/restores only an ephemeral anonymous native preference. Respect carried cooldowns.'
        required: true
        default: regression
        type: choice
        options:
          - regression
          - gitlab-ui-polish
          - bitbucket-ui-polish
          - gitlab-open-review
          - bitbucket-open-review
          - gitlab-summary-preview
          - gitlab-refinements
          - provider-ui-refinements
          - gitlab-walkthrough
          - bitbucket-walkthrough
          - bitbucket-walkthrough-files
          - walkthrough-render
          - provider-evidence
          - provider-access-evidence
          - provider-access
          - bitbucket-diff
          - bitbucket-ui
          - gitlab-ui
          - bitbucket-whitespace-session
          - bitbucket-whitespace-source
          - bitbucket-pipeline-shell
          - bitbucket-pipeline-syntax-on
          - bitbucket-pipeline-initial-on
          - bitbucket-list
          - bitbucket-authors
          - bitbucket-native-bash
          - bitbucket-native-bash-on
          - bitbucket-native-settings-diagnostic
          - bitbucket-native-file-menu
          - bitbucket-local-reviewed
          - bitbucket-comment
          - bitbucket-commit
          - bitbucket-commit-links
          - bitbucket-list-commit
          - gitlab-lists
          - gitlab-diff
          - gitlab-file-search
          - gitlab-whitespace-viewed
          - gitlab-whitespace-session
          - bitbucket-pr-whole-context
          - bitbucket-whole-context
          - gitlab-shell
          - gitlab-standalone-whole
          - gitlab-review
          - gitlab-local-reviewed
          - gitlab-bot
          - gitlab-coderabbit
          - gitlab-references
          - gitlab-binary
          - github
          - cross-provider-settings
          - all

permissions:
  contents: read
  actions: read

# Maintainer-labelled restacks defer public traffic; skipped jobs are not feature passes.
jobs:
  render-provider-walkthroughs:
    needs: [select-public-verification, installed-extension]
    if: ${{ !cancelled() && needs.select-public-verification.outputs.run == 'true' && (needs.select-public-verification.outputs.focus == 'walkthrough-render' || (needs.select-public-verification.outputs.focus == 'bitbucket-walkthrough-files' && needs.installed-extension.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Wait for both capture runs
        uses: actions/github-script@v9
        with:
          script: |
            for (let attempt = 0; attempt < 60; attempt++) {
              const runs = await Promise.all([42738172549, 42738358843].map(run_id => github.rest.actions.getWorkflowRun({ ...context.repo, run_id })));
              if (runs.every(run => run.data.status === 'completed')) return;
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            throw new Error('Capture runs are still pending; rendering has not started.');
      - uses: actions/download-artifact@v7
        with:
          name: geld-installed-browser-e2e
          run-id: '42738172549'
          github-token: ${{ github.token }}
          path: artifacts/raw-gitlab
      - uses: actions/download-artifact@v7
        with:
          name: geld-installed-browser-e2e
          run-id: '42738358843'
          github-token: ${{ github.token }}
          path: artifacts/raw-bitbucket
      - uses: actions/download-artifact@v7
        if: needs.select-public-verification.outputs.focus == 'bitbucket-walkthrough-files'
        with:
          name: geld-installed-browser-e2e
          path: artifacts/raw-bitbucket-files
      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg fonts-dejavu-core
      - name: Render titles, narration and timed captions
        run: |
          python3 apps/extension/scripts/render-walkthrough.py artifacts/raw-gitlab gitlab --out "$GITHUB_WORKSPACE/artifacts/finished"
          if [ -d artifacts/raw-bitbucket-files ]; then
            python3 apps/extension/scripts/render-walkthrough.py artifacts/raw-bitbucket bitbucket --continuation artifacts/raw-bitbucket-files --out "$GITHUB_WORKSPACE/artifacts/finished"
          else
            python3 apps/extension/scripts/render-walkthrough.py artifacts/raw-bitbucket bitbucket --out "$GITHUB_WORKSPACE/artifacts/finished"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: geld-gitlab-guided-walkthrough
          path: |
            artifacts/finished/gitlab-guided-walkthrough.mp4
            artifacts/finished/gitlab-captions.srt
            artifacts/finished/gitlab-captions.vtt
            artifacts/finished/gitlab-chapters.md
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: geld-bitbucket-guided-walkthrough
          path: |
            artifacts/finished/bitbucket-guided-walkthrough.mp4
            artifacts/finished/bitbucket-captions.srt
            artifacts/finished/bitbucket-captions.vtt
            artifacts/finished/bitbucket-chapters.md
          if-no-files-found: error
          retention-days: 30



  select-public-verification:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.selection.outputs.run }}
      focus: ${{ steps.selection.outputs.focus }}
    steps:
      - name: Select a public verification slice
        id: selection
        uses: actions/github-script@v9
        with:
          script: |
            const choices = new Set(['gitlab-ui-polish', 'bitbucket-ui-polish', 'gitlab-open-review', 'bitbucket-open-review', 'gitlab-summary-preview', 'gitlab-refinements', 'provider-ui-refinements', 'bitbucket-walkthrough-files', 'walkthrough-render', 'gitlab-walkthrough', 'bitbucket-walkthrough', 'regression', 'provider-evidence', 'provider-access-evidence', 'provider-access', 'bitbucket-diff', 'bitbucket-ui', 'gitlab-ui', 'bitbucket-whitespace-session', 'bitbucket-whitespace-source', 'bitbucket-pipeline-shell', 'bitbucket-pipeline-syntax-on', 'bitbucket-pipeline-initial-on', 'bitbucket-list', 'bitbucket-authors', 'bitbucket-native-bash', 'bitbucket-native-bash-on', 'bitbucket-native-settings-diagnostic', 'bitbucket-native-file-menu', 'bitbucket-local-reviewed', 'bitbucket-comment', 'bitbucket-commit', 'bitbucket-commit-links', 'bitbucket-list-commit', 'gitlab-lists', 'gitlab-diff', 'gitlab-file-search', 'gitlab-whitespace-viewed', 'gitlab-whitespace-session', 'bitbucket-pr-whole-context', 'bitbucket-whole-context', 'gitlab-shell', 'gitlab-standalone-whole', 'gitlab-review', 'gitlab-local-reviewed', 'gitlab-bot', 'gitlab-coderabbit', 'gitlab-references', 'gitlab-binary', 'github', 'cross-provider-settings', 'all']);
            const parseFocus = (body) => {
              const text = typeof body === 'string' ? body : '';
              const prefixes = text.match(/<!-- geld-browser-focus:/g) ?? [];
              const markers = [...text.matchAll(/<!-- geld-browser-focus: ([a-z-]+) -->/g)];
              if (prefixes.length === 0) return { focus: 'regression', valid: true };
              if (prefixes.length !== 1 || markers.length !== 1 || !choices.has(markers[0][1])) return { focus: 'regression', valid: false };
              return { focus: markers[0][1], valid: true };
            };
            let focus = 'regression';
            let run = false;
            if (context.eventName === 'workflow_dispatch') {
              const input = context.payload.inputs?.focus ?? 'regression';
              if (choices.has(input)) { focus = input; run = true; }
              else core.setFailed('Unsupported public verification focus. No provider navigation allowed.');
            } else if (context.eventName === 'pull_request') {
              const request = context.payload.pull_request;
              const sameRepository = request?.head?.repo?.full_name === `${context.repo.owner}/${context.repo.repo}`;
              const selected = sameRepository ? parseFocus(request.body) : { focus: 'regression', valid: true };
              focus = selected.focus;
              if (['opened', 'synchronize', 'reopened'].includes(context.payload.action)) run = true;
              else if (context.payload.action === 'edited' && sameRepository && selected.valid) {
                const change = context.payload.changes?.body;
                if (change && Object.hasOwn(change, 'from') && (typeof change.from === 'string' || change.from === null)) run = parseFocus(change.from).focus !== focus;
              }
            }
            const restack = context.eventName === 'pull_request' && (context.payload.pull_request?.labels ?? []).some(label => label?.name === 'geld:restack');
            if (restack) run = false;
            core.setOutput('focus', focus);
            core.setOutput('run', run ? 'true' : 'false');
            core.info(restack ? 'Public provider verification deferred for this maintainer-labelled restack. Normal CI remains required. No public feature verification ran or passed.' : run ? `Selected public verification slice: ${focus}.` : 'Skipping provider navigation: this event did not request a valid focus change. No feature verification ran or passed.');
  installed-extension:
    needs: select-public-verification
    if: needs.select-public-verification.outputs.run == 'true' && needs.select-public-verification.outputs.focus != 'walkthrough-render' && needs.select-public-verification.outputs.focus != 'bitbucket-whitespace-source' && (github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'geld:restack'))
    # Skipped selector updates never enter the browser queue.
    # GitHub keeps one running and one pending job; a new selected job may replace the pending job without FIFO guarantees.
    concurrency:
      group: geld-installed-browser-public-providers
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: ${{ contains(fromJSON('["bitbucket-walkthrough-files", "bitbucket-ui-polish", "provider-ui-refinements"]'), needs.select-public-verification.outputs.focus) && 75 || 15 }}
    env:
      GELD_BROWSER_ARTIFACTS: ${{ github.workspace }}/artifacts/browser-e2e
      GELD_BROWSER_PREVIOUS_REPORT: ${{ github.workspace }}/.browser-previous-evidence/report.json
      GELD_BROWSER_FOCUS: ${{ needs.select-public-verification.outputs.focus }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Find prior provider cooldown evidence
        id: cooldowns
        uses: actions/github-script@v9
        with:
          script: |
            const repository = context.repo;
            const artifactName = process.env.GELD_BROWSER_FOCUS === 'provider-access-evidence' ? 'geld-provider-access' : 'geld-installed-browser-e2e';
            const current = (await github.rest.actions.getWorkflowRun({ ...repository, run_id: context.runId })).data;
            const expectedRepository = `${repository.owner}/${repository.repo}`;
            if (current.id !== context.runId || !Number.isSafeInteger(current.workflow_id) || current.head_repository?.full_name !== expectedRepository) throw Error('Current cooldown history repository is unqualified');
            // https://docs.github.com/en/rest/actions/artifacts#list-artifacts-for-a-repository
            // The exact name filter skips unrelated artifacts and skip-only workflow runs.
            const artifacts = [];
            let exhausted = false;
            let total = null;
            for (let page = 1; page <= 5; page++) {
              const result = await github.rest.actions.listArtifactsForRepo({ ...repository, name: artifactName, per_page: 100, page });
              if (!Array.isArray(result.data.artifacts) || !Number.isSafeInteger(result.data.total_count) || result.data.total_count < 0) throw Error('Malformed cooldown artifact history');
              if (total !== null && total !== result.data.total_count) throw Error('Cooldown artifact history changed during discovery');
              total = result.data.total_count;
              if (result.data.artifacts.length > 100) throw Error('Oversized cooldown artifact page');
              artifacts.push(...result.data.artifacts);
              if (artifacts.length > total || (result.data.artifacts.length < 100 && artifacts.length < total)) throw Error('Incomplete cooldown artifact page');
              if (artifacts.length === total) { exhausted = true;break; }
            }
            if (!exhausted) throw Error('Cooldown artifact history exceeded its bounded scan; no provider navigation allowed');
            const ids = new Set();
            const candidates = [];
            for (const artifact of artifacts) {
              if (artifact.name !== artifactName) throw Error('Cooldown artifact name filter was not respected');
              if (!Number.isSafeInteger(artifact.id) || ids.has(artifact.id)) throw Error('Ambiguous cooldown artifact pagination');
              ids.add(artifact.id);
              const created = Date.parse(artifact.created_at);
              if (!Number.isFinite(created) || !Number.isSafeInteger(artifact.workflow_run?.id)) throw Error('Malformed cooldown artifact provenance');
              if (artifact.expired) {
                if (created > Date.now() - 60 * 60 * 1000) throw Error('Recent cooldown evidence is unavailable; no provider navigation allowed');
                continue;
              }
              if (artifact.workflow_run.id === context.runId) throw Error('Current run has prior-attempt evidence; resolve its cooldown before retrying');
              candidates.push({ artifact, created });
            }
            candidates.sort((left, right) => right.created - left.created || right.artifact.id - left.artifact.id);
            let selected = null;
            let inspected = 0;
            for (const candidate of candidates) {
              if (selected !== null && candidate.created < selected.created) break;
              if (++inspected > 100) throw Error('Cooldown provenance exceeded its bounded scan; no provider navigation allowed');
              const run = (await github.rest.actions.getWorkflowRun({ ...repository, run_id: candidate.artifact.workflow_run.id })).data;
              if (!Number.isSafeInteger(run.workflow_id) || run.id !== candidate.artifact.workflow_run.id) throw Error('Cooldown run identity mismatch');
              if (run.head_repository?.full_name !== expectedRepository || run.workflow_id !== current.workflow_id) continue;
              if (run.status !== 'completed') throw Error('Prior provider verification is still running; no provider navigation allowed');
              if (selected !== null) throw Error('Ambiguous latest cooldown evidence; no provider navigation allowed');
              selected = candidate;
            }
            if (selected === null) core.info('No retained matching provider cooldown history exists; initial verification is permitted.');
            else {
              core.setOutput('run-id', String(selected.artifact.workflow_run.id));
              core.info(`Loading provider cooldown evidence from installed run ${selected.artifact.workflow_run.id}.`);
            }
      - name: Restore prior provider cooldown evidence
        if: steps.cooldowns.outputs.run-id != ''
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.select-public-verification.outputs.focus == 'provider-access-evidence' && 'geld-provider-access' || 'geld-installed-browser-e2e' }}
          run-id: ${{ steps.cooldowns.outputs.run-id }}
          github-token: ${{ github.token }}
          path: .browser-previous-evidence
      - name: Wait for the carried Bitbucket browser budget
        if: contains(fromJSON('["bitbucket-walkthrough-files", "bitbucket-ui-polish", "provider-ui-refinements"]'), needs.select-public-verification.outputs.focus)
        run: |
          python3 - <<'PY'
          import json, os, time
          from datetime import datetime
          with open(os.environ['GELD_BROWSER_PREVIOUS_REPORT']) as source:
              previous = json.load(source)
          assert previous.get('schema') == 1
          times = previous.get('bitbucketAnonymousRequestTimes', [])
          assert isinstance(times, list) and len(times) <= 1000
          values = [datetime.fromisoformat(value.replace('Z', '+00:00')).timestamp() for value in times]
          target = max(values, default=0) + 3605
          if os.environ['GELD_BROWSER_FOCUS'] == 'provider-ui-refinements':
              cooldowns = previous.get('cooldowns', {})
              assert isinstance(cooldowns, dict)
              until = [datetime.fromisoformat(value.replace('Z', '+00:00')).timestamp() + 5 for provider, value in cooldowns.items() if provider in ('gitlab', 'bitbucket') and value is not None]
              target = max([target, *until])
          assert target - time.time() < 3700
          while time.time() < target:
              remaining = int(target - time.time())
              print(f'Honoring carried request window: {remaining}s remaining; no provider navigation.', flush=True)
              time.sleep(min(45, max(0, target - time.time())))
          PY
      - name: Export retained provider evidence without browser navigation
        if: needs.select-public-verification.outputs.focus == 'provider-evidence'
        run: node scripts/provider-evidence.mjs
      - name: Export retained optional-provider access state
        if: needs.select-public-verification.outputs.focus == 'provider-access-evidence'
        run: node scripts/provider-access-evidence.mjs
      - if: needs.select-public-verification.outputs.focus != 'provider-evidence' && needs.select-public-verification.outputs.focus != 'provider-access-evidence'
        run: pnpm --filter @geld/extension... install --frozen-lockfile
      - if: needs.select-public-verification.outputs.focus != 'provider-evidence' && needs.select-public-verification.outputs.focus != 'provider-access-evidence'
        run: pnpm --filter @geld/extension build:chrome
      - name: Install native browser dialog accessibility
        if: needs.select-public-verification.outputs.focus != 'provider-evidence' && needs.select-public-verification.outputs.focus != 'provider-access-evidence'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb xauth dbus-x11 at-spi2-core python3-pyatspi libglib2.0-bin
          case "$GELD_BROWSER_FOCUS" in
            gitlab-walkthrough|bitbucket-walkthrough|bitbucket-walkthrough-files) sudo apt-get install --no-install-recommends -y ffmpeg ;;
          esac
      - name: Locate the runner's Chrome
        if: needs.select-public-verification.outputs.focus != 'provider-evidence' && needs.select-public-verification.outputs.focus != 'provider-access-evidence'
        shell: bash
        run: |
          browser_executable="$(command -v google-chrome-stable || command -v google-chrome)"
          "$browser_executable" --version
          echo "GELD_BROWSER_EXECUTABLE=$browser_executable" >> "$GITHUB_ENV"
      - name: Test the installed extension on public pages
        if: needs.select-public-verification.outputs.focus != 'provider-evidence' && needs.select-public-verification.outputs.focus != 'provider-access-evidence'
        timeout-minutes: ${{ needs.select-public-verification.outputs.focus == 'provider-access' && 3 || needs.select-public-verification.outputs.focus == 'bitbucket-whitespace-session' && 5 || 15 }}
        env:
          GELD_BROWSER_NATIVE_DIALOGS: '1'
        run: env -u NO_AT_BRIDGE dbus-run-session -- xvfb-run -a --server-args='-screen 0 2000x1400x24' pnpm --filter @geld/extension test:browser
      - name: Save browser evidence
        if: always() && needs.select-public-verification.outputs.focus != 'provider-evidence' && needs.select-public-verification.outputs.focus != 'provider-access-evidence'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.select-public-verification.outputs.focus == 'provider-access' && 'geld-provider-access' || 'geld-installed-browser-e2e' }}
          path: artifacts/browser-e2e
          if-no-files-found: warn
          retention-days: 7

  bitbucket-static-source:
    needs: select-public-verification
    if: needs.select-public-verification.outputs.run == 'true' && needs.select-public-verification.outputs.focus == 'bitbucket-whitespace-source' && (github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'geld:restack'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GELD_SOURCE_ARTIFACTS: ${{ github.workspace }}/artifacts/bitbucket-source-research
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm --filter @geld/extension... install --frozen-lockfile
      - name: Read fixed public PR loader dependencies as source
        run: node apps/extension/scripts/bitbucket-whitespace-source-research.mjs --pr-dependencies
      - name: Save bounded static source evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: geld-bitbucket-source-research
          path: artifacts/bitbucket-source-research
          if-no-files-found: warn
          retention-days: 7
