# Geld review summary
#
# Maintains one comment on each pull request. Safe for forks: this workflow
# uses pull_request_target so it runs with the base repository's token, and
# the action only calls the GitHub API — it never checks out the pull request
# head. Copy this file to `.github/workflows/geld.yml`.
#
# Optional AI: add repository secret GELD_AI_KEY (your own gateway key) and
# uncomment the ai-* inputs below.
#
# Optional review-bot triggers: a comment `/geld run greptile` (or `bugbot`,
# `devin`, several separated by spaces) from someone with write access starts
# that bot through its own API, without the bot having to read the comment.
# Store each bot's key as a repository secret, then name that secret below.

name: Geld summary

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  pull_request_review_thread:
    types: [resolved, unresolved]
  issue_comment:
    types: [created, edited, deleted]
  check_run:
    types: [completed]

env:
  # The repository secret holding each bot's key, by name. Empty leaves the bot off. The Geld extension reads these
  # names (never the keys) to know which bots its Rerun can start here.
  GELD_GREPTILE_KEY_SECRET: '' # e.g. GREPTILE_API_KEY, from Greptile > Settings > Organization > API Keys
  GELD_BUGBOT_KEY_SECRET: '' # e.g. CURSOR_API_KEY, from Cursor Dashboard > API Keys (admin scope, Cursor Enterprise)
  GELD_DEVIN_KEY_SECRET: '' # e.g. DEVIN_API_KEY, a Devin service user with the UseReviewManual permission
  GELD_DEVIN_ORG_ID: '' # your Devin organization id (org-…); not a secret

jobs:
  summary:
    if: >-
      github.event.pull_request != null ||
      github.event.issue.pull_request != null ||
      (github.event.check_run.pull_requests[0] != null)
    # Only the newest run matters for the one summary comment, so a burst of events cancels the runs before it.
    concurrency:
      group: geld-summary-${{ github.event.pull_request.number || github.event.issue.number || github.event.check_run.pull_requests[0].number || github.run_id }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
      checks: read
      contents: read
    steps:
      - name: Write Geld summary
        uses: brandonmcconnell/geld/apps/action@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Optional AI (bring your own key; nothing is sent without it):
          # ai-key: ${{ secrets.GELD_AI_KEY }}
          # ai-base-url: https://ai-gateway.vercel.sh
          # model: openai/gpt-4.1-mini
          # suggested-fixes: bots

  # No concurrency group on purpose: every trigger comment runs, in parallel with the others and with the summary.
  trigger:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '/geld run')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
      contents: read
    steps:
      - name: Start the requested review bots
        uses: actions/github-script@v9
        env:
          GREPTILE_KEY: ${{ env.GELD_GREPTILE_KEY_SECRET != '' && secrets[env.GELD_GREPTILE_KEY_SECRET] || '' }}
          BUGBOT_KEY: ${{ env.GELD_BUGBOT_KEY_SECRET != '' && secrets[env.GELD_BUGBOT_KEY_SECRET] || '' }}
          DEVIN_KEY: ${{ env.GELD_DEVIN_KEY_SECRET != '' && secrets[env.GELD_DEVIN_KEY_SECRET] || '' }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const comment = context.payload.comment;
            const pr = context.payload.issue;
            const prUrl = pr.pull_request.html_url;
            const react = (content) =>
              github.rest.reactions.createForIssueComment({ owner, repo, comment_id: comment.id, content }).catch(() => {});

            // Secrets are readable by any comment's workflow, so only people who could push may spend the bots' credits.
            if (comment.user.type === 'Bot') return core.notice('Ignored: trigger comments from bots are not run.');
            const { data: access } = await github.rest.repos.getCollaboratorPermissionLevel({ owner, repo, username: comment.user.login });
            if (access.permission !== 'admin' && access.permission !== 'write') {
              await react('confused');
              return core.setFailed(`${comment.user.login} needs write access to start review bots.`);
            }

            const firstLine = comment.body.trim().split(/\r?\n/)[0];
            const match = /^\/geld\s+run\s+(.+)$/i.exec(firstLine);
            const bots = [...new Set((match?.[1] ?? '').toLowerCase().split(/[\s,]+/).filter(Boolean))];
            const known = ['greptile', 'bugbot', 'devin'];
            const unknown = bots.filter((bot) => !known.includes(bot));
            if (bots.length === 0 || unknown.length > 0) {
              await react('confused');
              return core.setFailed(`Unknown or missing bot (${unknown.join(', ') || 'none'}). Use: /geld run ${known.join(' | ')}`);
            }

            const missing = (bot) => {
              const name = process.env[`GELD_${bot}_KEY_SECRET`];
              return name ? `the ${name} secret is empty or missing` : `set GELD_${bot}_KEY_SECRET in the workflow to the name of the secret holding its key`;
            };

            // Greptile's API speaks MCP over HTTP and may answer as an event stream.
            const readMcp = async (response) => {
              const text = await response.text();
              const json = (response.headers.get('content-type') ?? '').includes('text/event-stream')
                ? JSON.parse(text.split('\n').filter((line) => line.startsWith('data:')).map((line) => line.slice(5)).pop() ?? '{}')
                : JSON.parse(text || '{}');
              if (json.error) throw new Error(json.error.message ?? 'Greptile refused the request');
              if (json.result?.isError) throw new Error(json.result.content?.[0]?.text ?? 'Greptile refused the request');
            };

            const start = {
              greptile: async () => {
                const key = process.env.GREPTILE_KEY;
                if (!key) throw new Error(missing('GREPTILE'));
                const response = await fetch('https://api.greptile.com/mcp', {
                  method: 'POST',
                  headers: { Authorization: `Bearer ${key}`, 'Content-Type': 'application/json', Accept: 'application/json, text/event-stream' },
                  body: JSON.stringify({
                    jsonrpc: '2.0',
                    id: 1,
                    method: 'tools/call',
                    params: {
                      name: 'trigger_code_review',
                      arguments: { name: `${owner}/${repo}`, remote: 'github', defaultBranch: context.payload.repository.default_branch, prNumber: pr.number },
                    },
                  }),
                });
                if (!response.ok) throw new Error(`Greptile answered ${response.status}`);
                await readMcp(response);
              },
              bugbot: async () => {
                const key = process.env.BUGBOT_KEY;
                if (!key) throw new Error(missing('BUGBOT'));
                const response = await fetch('https://api.cursor.com/bugbot/review', {
                  method: 'POST',
                  headers: { Authorization: `Basic ${Buffer.from(`${key}:`).toString('base64')}`, 'Content-Type': 'application/json' },
                  body: JSON.stringify({ prUrl }),
                });
                const answer = await response.json().catch(() => ({}));
                if (!response.ok || answer.outcome === 'error') throw new Error(answer.message ?? `Cursor answered ${response.status}`);
              },
              devin: async () => {
                const key = process.env.DEVIN_KEY;
                const org = process.env.GELD_DEVIN_ORG_ID;
                if (!key) throw new Error(missing('DEVIN'));
                if (!org) throw new Error('set GELD_DEVIN_ORG_ID in the workflow to your Devin organization id');
                const response = await fetch(`https://api.devin.ai/v3/organizations/${encodeURIComponent(org)}/pr-reviews`, {
                  method: 'POST',
                  headers: { Authorization: `Bearer ${key}`, 'Content-Type': 'application/json' },
                  body: JSON.stringify({ pr_url: prUrl }),
                });
                if (!response.ok) throw new Error(`Devin answered ${response.status}`);
              },
            };

            const results = await Promise.allSettled(bots.map((bot) => start[bot]()));
            const failed = results.flatMap((result, index) => (result.status === 'rejected' ? [`${bots[index]}: ${result.reason.message}`] : []));
            for (const [index, result] of results.entries()) if (result.status === 'fulfilled') core.info(`${bots[index]}: review queued`);
            await react(failed.length === 0 ? 'rocket' : 'confused');
            if (failed.length > 0) core.setFailed(failed.join('\n'));
