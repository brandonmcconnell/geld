<!doctype html>
<!-- 16:10 version of the marquee promo tile, used as the first store screenshot. Render at 2880x1800 in headless Chrome (deviceScaleFactor 1), save as JPEG, Lanczos-downscale to 1280x800 for Chrome/Edge/Firefox. Fonts resolve from apps/site/node_modules after pnpm install. digest-dark.png is the home page hero's digest card in dark mode, captured at 4x; re-capture it when the card changes. -->
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: Geist; src: url('../../../../site/node_modules/geist/dist/fonts/geist-sans/Geist-Variable.woff2') format('woff2'); font-weight: 100 900; }
  html, body { margin: 0; }
  body { width: 2880px; height: 1800px; background: #0b0d12; color: #f0f2f5; font-family: Geist, sans-serif; position: relative; overflow: hidden; -webkit-font-smoothing: antialiased; }
  .left { position: absolute; left: 160px; top: 0; height: 1800px; width: 1320px; display: flex; flex-direction: column; justify-content: center; }
  .logo { display: block; height: 118px; width: fit-content; margin-bottom: 96px; }
  h1 { margin: 0; font-size: 118px; line-height: 1.06; font-weight: 600; letter-spacing: -0.035em; white-space: nowrap; }
  .sub { margin: 64px 0 0; font-size: 56px; line-height: 1.35; color: #a1a7b0; font-weight: 400; }
  .btn { margin-top: 88px; display: inline-flex; align-items: center; width: fit-content; height: 132px; padding: 0 60px; background: #f0f2f5; color: #16181d; font-size: 46px; font-weight: 500; border-radius: 26px; corner-shape: bevel square; }
  .digest { position: absolute; right: 160px; top: 50%; width: 1160px; transform: translateY(-50%); border-radius: 34px; box-shadow: 0 60px 160px rgb(0 0 0 / 0.55); }
</style>
</head>
<body>
  <div class="left">
    <img class="logo" src="../../../../../assets/brand/geld-logo-white.svg" alt="Geld" />
    <h1>Code review is broken.<br/>Geld fixes it.</h1>
    <p class="sub">Less noise. More shipping.<br/>Chrome · Edge · Firefox · Safari</p>
    <div class="btn">Add to browser</div>
  </div>
  <img class="digest" src="digest-dark.png" alt="" />
</body>
</html>
